name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  quality:
    name: Lint, Build, Release Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Web
        run: npm run build:web

      - name: Release Readiness
        run: npm run check:release

      - name: Secret Scan
        run: npm run check:secrets

      - name: Syntax Check Services
        run: node --check server/authService.mjs && node --check server/remoteRelay.mjs
