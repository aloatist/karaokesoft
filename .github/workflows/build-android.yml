name: Build Android APK/AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Android
        run: npm run android:sync

      - name: Build APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build APK Release
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KARAOKEYT_KEYSTORE_PASSWORD: ${{ secrets.KARAOKEYT_KEYSTORE_PASSWORD }}
          KARAOKEYT_KEY_ALIAS: ${{ secrets.KARAOKEYT_KEY_ALIAS }}
          KARAOKEYT_KEY_PASSWORD: ${{ secrets.KARAOKEYT_KEY_PASSWORD }}
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: karaokeyt-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: karaokeyt-android-release
          path: android/app/build/outputs/apk/release/*.apk
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
