<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KaraokeYT</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main class="popupBody">
      <h1>KaraokeYT</h1>
      <p>Chuột phải vào link hoặc trang YouTube, chọn KaraokeYT để phát hoặc thêm vào danh sách.</p>
      <div id="currentUrl" class="small"></div>
      <div id="connectionStatus" class="status statusPending">Chưa kiểm tra app laptop.</div>
      <div class="actions">
        <button id="checkApp" type="button">Kiểm tra app</button>
        <button id="openApp" type="button">Mở Control</button>
        <button id="openOptions" class="secondary" type="button">Cài đặt</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
